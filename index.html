<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>还款计划</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>

  <style>
    .payment-card { transition: 0.25s; }
    .payment-card.paid { opacity: 0.55; }
    .payment-card.current { border-color: #3b82f6; background: #eff6ff; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">
<div class="max-w-2xl mx-auto px-4 py-6">

  <!-- 标题 -->
  <h1 class="text-xl font-bold mb-4">还款进度</h1>

  <!-- 概览 -->
  <div class="bg-white rounded-lg p-4 border shadow-sm">
    <div class="flex justify-between text-sm text-gray-600 mb-2">
      <span>已还期数</span>
      <span id="paidInstallments"></span>
    </div>
    <div class="w-full bg-gray-200 h-2 rounded">
      <div id="progressBar" class="bg-blue-500 h-2 rounded" style="width:0%"></div>
    </div>
    <p id="progressText" class="text-right text-xs text-gray-500 mt-1"></p>

    <div class="mt-4 text-sm flex justify-between">
      <span>剩余应还本金</span>
      <span id="remainingPrincipal" class="font-semibold"></span>
    </div>
  </div>

  <!-- 下期应还（动态消失） -->
  <div id="currentPaymentSection" class="bg-white rounded-lg p-4 border shadow-sm mt-4">
    <div class="text-sm text-gray-600 flex justify-between">
      <span id="currentTerm"></span>
      <span id="currentDueDate"></span>
    </div>
    <div class="flex justify-between mt-2">
      <span class="text-gray-700">本期应还</span>
      <span id="currentAmount" class="font-bold"></span>
    </div>
    <div id="currentBreakdown" class="text-xs text-gray-500 mt-1"></div>
    <button id="repayNow" class="w-full py-2 bg-blue-600 text-white rounded-lg mt-3 active:scale-95">
      立即还款
    </button>
  </div>

  <!-- 一次性结清 -->
  <button id="settleNow" class="w-full py-2 bg-red-600 text-white rounded-lg mt-4 active:scale-95">
    一次性还清剩余全部
  </button>

  <!-- 还款计划 -->
  <h2 class="text-lg font-bold mt-6 mb-2">还款计划</h2>
  <div id="paymentSchedule" class="space-y-2"></div>

  <!-- 还款记录 -->
  <h2 class="text-lg font-bold mt-6 mb-2">还款记录</h2>
  <div id="paymentRecords" class="space-y-2"></div>

</div>

<script>
/* =============================
   初始化贷款数据
   ============================= */
const data = {
  totalTerms: 12,
  paidTerms: 3,
  remainingPrincipal: 6106.25,
  schedule: [
    { term: 1, due: '2025-09-05', amount: 757.22, principal: 658.75, interest: 98.47, status: 'paid', tx:'WX25090598765432' },
    { term: 2, due: '2025-10-05', amount: 757.22, principal: 658.75, interest: 98.47, status: 'paid', tx:'WX25100512345678' },
    { term: 3, due: '2025-11-05', amount: 757.22, principal: 658.75, interest: 98.47, status: 'paid', tx:'WX25110587654321' },
    { term: 4, due: '2025-12-05', amount: 757.22, principal: 658.75, interest: 98.47, status: 'upcoming' },
    { term: 5, due: '2026-01-05', amount: 757.22, principal: 658.75, interest: 98.47, status: 'upcoming' },
    { term: 6, due: '2026-02-05', amount: 757.22, principal: 658.75, interest: 98.47, status: 'upcoming' },
    { term: 7, due: '2026-03-05', amount: 757.22, principal: 658.75, interest: 98.47, status: 'upcoming' },
    { term: 8, due: '2026-04-05', amount: 757.22, principal: 658.75, interest: 98.47, status: 'upcoming' },
    { term: 9, due: '2026-05-05', amount: 757.22, principal: 658.75, interest: 98.47, status: 'upcoming' },
    { term:10, due: '2026-06-05', amount: 757.22, principal: 658.75, interest: 98.47, status: 'upcoming' },
    { term:11, due: '2026-07-05', amount: 757.22, principal: 658.75, interest: 98.47, status: 'upcoming' },
    { term:12, due: '2026-08-05', amount: 757.22, principal: 658.75, interest: 98.47, status: 'upcoming' }
  ],
  records: [
    { title: '第3期还款', date: '2025-11-05 12:44', tx:'WX25110587654321', amount:757.22 },
    { title: '第2期还款', date: '2025-10-05 09:18', tx:'WX25100512345678', amount:757.22 },
    { title: '第1期还款', date: '2025-09-05 16:03', tx:'WX25090598765432', amount:757.22 }
  ]
};

function format(n){ return '¥' + n.toFixed(2); }
function genTx(){ return 'RP' + Math.floor(Math.random()*1e12); }
function now(){ return new Date().toLocaleString(); }

function updateCurrentTerm(){
  data.current = data.schedule.find(s=>s.status==='upcoming') || null;
}

function render(){
  updateCurrentTerm();

  document.getElementById('paidInstallments').textContent = data.paidTerms+'期';
  document.getElementById('progressText').textContent = `${data.paidTerms}/${data.totalTerms}期`;
  document.getElementById('progressBar').style.width = (data.paidTerms/data.totalTerms*100)+'%';
  document.getElementById('remainingPrincipal').textContent = format(data.remainingPrincipal);

  if(data.current){
    document.getElementById('currentPaymentSection').style.display = '';
    document.getElementById('currentTerm').textContent = `第${data.current.term}期`;
    document.getElementById('currentDueDate').textContent = `还款日期: ${data.current.due}`;
    document.getElementById('currentAmount').textContent = format(data.current.amount);
    document.getElementById('currentBreakdown').textContent =
      `包含本金 ${format(data.current.principal)}，利息 ${format(data.current.interest)}`;
  } else {
    document.getElementById('currentPaymentSection').style.display = 'none';
  }

  const cont = document.getElementById('paymentSchedule');
  cont.innerHTML = '';
  data.schedule.forEach(s=>{
    cont.innerHTML += `
      <div class="payment-card border rounded-lg p-4 flex justify-between items-center ${s.status} ${data.current && s.term===data.current.term?'current':''}">
        <div>
          <div class="font-medium">第${s.term}期</div>
          <div class="text-gray-500 text-sm mt-1">还款日期: ${s.due}</div>
          ${s.tx?`<div class="text-green-600 text-xs mt-1">已还清 | 交易号: ${s.tx}</div>`:''}
        </div>
        <div class="font-bold">${format(s.amount)}</div>
      </div>`;
  });

  const rec = document.getElementById('paymentRecords');
  rec.innerHTML = '';
  data.records.forEach(r=>{
    rec.innerHTML += `
      <div class="payment-card bg-white rounded-lg border p-4 shadow-sm flex justify-between items-center">
        <div>
          <div class="font-medium">${r.title}</div>
          <div class="text-gray-500 text-sm mt-1">还款日期: ${r.date}</div>
          <div class="text-gray-500 text-sm">交易号: ${r.tx}</div>
        </div>
        <div class="text-right font-bold">${format(r.amount)}</div>
      </div>`;
  });
}
render();

/* 单期还款 */
document.getElementById('repayNow').onclick = ()=>{
  const s = data.current;
  s.status='paid';
  s.tx=genTx();
  data.paidTerms++;
  data.remainingPrincipal -= s.principal;
  data.records.unshift({title:`第${s.term}期还款`, date:now(), tx:s.tx, amount:s.amount});
  render();
};

/* 一次性结清 */
document.getElementById('settleNow').onclick = ()=>{
  data.schedule.forEach(s=>{
    if(s.status!=='paid'){
      s.status='paid';
      s.tx=genTx();
      data.records.unshift({title:`第${s.term}期结清`, date:now(), tx:s.tx, amount:s.amount});
      data.remainingPrincipal -= s.principal;
      data.paidTerms++;
    }
  });
  data.remainingPrincipal = 0;
  render();
};
</script>
</body>
</html>
